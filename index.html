<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTDARA</title>
    <link rel="icon" id="siteFavicon" href="">
    <!-- เพิ่มฟอนต์ Cinzel สำหรับตัวหนังสือแบบหรูหรา -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes pageFadeIn {
            0% { opacity: 0; filter: blur(8px); transform: scale(1.02); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            font-family: 'Inter', sans-serif; background-color: #030305; color: #ffffff;
            overflow: hidden; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
            animation: pageFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #bg-image {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 0; will-change: transform;
            animation: bgZoom 50s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
        }
        @keyframes bgZoom { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(3, 3, 5, 0.92) 0%, rgba(10, 10, 18, 0.85) 100%);
            z-index: 1; pointer-events: none;
        }

        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        .main-content {
            position: relative; z-index: 3; flex: 1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; gap: clamp(18px, 2.8vh, 30px); width: 100%;
            overflow-y: auto;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .emblem-container {
            position: relative; width: clamp(230px, 31vw, 350px); height: clamp(230px, 31vw, 350px);
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 0px; flex-shrink: 0;
            animation: logoFloat 4s ease-in-out infinite;
            will-change: transform;
        }

        .main-logo {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 0 45px rgba(255, 255, 255, 0.6)); z-index: 2;
            pointer-events: none;
        }

        .header-section { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; flex-shrink: 0; width: 100%; }

        /* ตัวหนังสือสไตล์หรูหรา (Luxury Title) */
        .luxury-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 5vw, 4rem); 
            font-weight: 700;
            letter-spacing: 0.15em;
            margin: 0;
            text-transform: uppercase;
            color: #ffffff;
            
            background: linear-gradient(to right, #b3b3b3 0%, #ffffff 20%, #ffffff 80%, #b3b3b3 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            animation: textShine 5s linear infinite, sparkleShadow 3s ease-in-out infinite;
            will-change: transform, filter, background-position;
            padding-bottom: 5px;
        }

        @keyframes textShine {
            0% { background-position: 200% center; }
            100% { background-position: 0% center; }
        }

        @keyframes sparkleShadow {
            0%, 100% { 
                filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3)) drop-shadow(0 0 15px rgba(255, 255, 255, 0.1)); 
                transform: scale(1); 
            }
            50% { 
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 35px rgba(255, 255, 255, 0.6)) drop-shadow(0 0 50px rgba(255, 255, 255, 0.4)); 
                transform: scale(1.02); 
            }
        }

        .dark-divider {
            display: flex; align-items: center; justify-content: center; gap: 14px; color: #777777;
            font-size: clamp(0.6rem, 1vw, 0.75rem); letter-spacing: 0.4em; text-transform: uppercase; font-weight: 600; opacity: 0.9;
            width: 100%;
        }
        .dark-divider::before, .dark-divider::after {
            content: ''; width: clamp(60px, 9vw, 100px); height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
        }

        .btn-container {
            display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; max-width: 410px; z-index: 10; margin-top: 2px;
        }

        /* ปุ่ม MEMBERS โทนดำเทา */
        .btn-members {
            width: 100%; text-decoration: none; 
            background: linear-gradient(145deg, #181818, #0a0a0a);
            border: 1px solid #333333; 
            border-radius: 45px; padding: clamp(16px, 2.3vh, 20px) 0;
            color: #d1d1d1; font-family: 'Inter', sans-serif; font-weight: 700; font-size: clamp(0.95rem, 1.7vw, 1.15rem);
            text-transform: uppercase; letter-spacing: 0.35em; 
            display: flex; justify-content: center; align-items: center; gap: 18px;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.8), -2px -2px 15px rgba(255,255,255,0.02);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            box-sizing: border-box;
            position: relative; overflow: hidden;
        }

        .btn-members::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transform: translateX(-100%);
            transition: transform 0.7s ease;
        }

        .btn-members:hover {
            background: linear-gradient(145deg, #222222, #121212); 
            border-color: #555555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(150, 150, 150, 0.1);
            transform: translateY(-3px) scale(1.02); 
            color: #ffffff;
        }

        .btn-members:hover::after {
            transform: translateX(100%);
        }

        /* กล่องจัดเรียงปุ่มย่อย 2 ปุ่มแนวนอน */
        .sub-btn-group {
            display: flex;
            flex-direction: row;
            width: 100%;
            gap: 12px;
            margin-top: 4px;
        }

        /* ปุ่มย่อย InflexStyle & Unforgettable */
        .btn-sub {
            flex: 1; 
            text-decoration: none; 
            background: linear-gradient(145deg, #151515, #080808);
            border: 1px solid #2a2a2a; 
            border-radius: 40px; 
            padding: clamp(14px, 2vh, 18px) 0;
            color: #bbbbbb; 
            font-family: 'Inter', sans-serif; 
            font-weight: 600; 
            font-size: clamp(0.75rem, 1.3vw, 0.9rem);
            text-transform: uppercase; 
            letter-spacing: 0.15em; 
            display: flex; justify-content: center; align-items: center;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.6), -1px -1px 10px rgba(255,255,255,0.01);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            box-sizing: border-box;
            position: relative; overflow: hidden;
        }

        .btn-sub::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-sub:hover {
            background: linear-gradient(145deg, #1e1e1e, #101010); 
            border-color: #444444;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8), 0 0 15px rgba(150, 150, 150, 0.1);
            transform: translateY(-2px) scale(1.02); 
            color: #ffffff;
        }

        .btn-sub:hover::after {
            transform: translateX(100%);
        }

        .partner-section-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 700px; z-index: 10; margin-top: 2px;
        }
        .partner-heading {
            font-family: 'Oswald', sans-serif; font-size: clamp(0.7rem, 1.1vw, 0.85rem); letter-spacing: 0.3em; color: #888888; text-transform: uppercase; opacity: 0.85;
        }
        .partner-buttons-group {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%;
        }

        .partner-btn {
            text-decoration: none; 
            background: linear-gradient(145deg, #111111, #050505);
            border: 1px solid #2a2a2a; 
            border-radius: 25px; padding: clamp(10px, 1.4vh, 14px) clamp(20px, 2.8vw, 30px);
            color: #888888; font-family: 'Inter', sans-serif; font-weight: 500; font-size: clamp(0.78rem, 1.2vw, 0.92rem);
            text-transform: uppercase; letter-spacing: 0.18em;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
            text-align: center;
            flex: 0 1 auto;
        }

        .partner-btn:hover {
            background: #1c1c1c; 
            border-color: #444444; 
            color: #ffffff;
            transform: translateY(-2px) scale(1.02); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.7), 0 0 12px rgba(255, 255, 255, 0.08);
        }

        .music-widget {
            position: fixed; bottom: 20px; right: 20px; background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
            width: 280px; z-index: 99999; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .music-widget.collapsed { height: 55px; }
        .music-widget.expanded { height: 110px; }
        .music-header { display: flex; align-items: center; padding: 8px 12px; height: 55px; box-sizing: border-box; cursor: pointer; }
        .cover-wrapper { position: relative; width: 34px; height: 34px; margin-right: 10px; flex-shrink: 0; }
        .music-cover {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.3); animation: spinRecord 5s linear infinite; animation-play-state: paused;
        }
        .playing .music-cover { animation-play-state: running; border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.4); }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }

        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .music-label { font-size: 0.4rem; color: #888; letter-spacing: 0.2em; font-weight: 700; }
        .music-title { font-family: 'Oswald', sans-serif; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .music-link { font-size: 0.42rem; color: #777; text-decoration: none; }
        .toggle-icon { font-size: 0.48rem; color: #aaa; padding: 4px; transition: 0.3s; }
        .music-controls { display: flex; align-items: center; padding: 0 14px 10px 14px; gap: 12px; opacity: 0; transition: opacity 0.3s; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.4); }
        .music-widget.expanded .music-controls { opacity: 1; }
        .ctrl-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
        .vol-wrapper { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 6px; }
        .vol-slider { flex: 1; -webkit-appearance: none; height: 2px; background: rgba(255,255,255,0.2); outline: none; cursor: pointer; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; background: #fff; cursor: pointer; }

        .footer-credit {
            position: relative; z-index: 3; width: 100%; text-align: center; padding: 12px 0;
            font-size: 0.55rem; color: #666; letter-spacing: 0.35em; text-transform: uppercase; font-weight: 600;
            display: flex; justify-content: center; align-items: center; gap: 10px; flex-shrink: 0;
        }
        .footer-link-web { color: #888; text-decoration: none; transition: 0.3s; }
        .footer-link-web:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div class="bg-overlay" id="bgOverlay"></div>
    <canvas id="particleCanvas"></canvas>

    <main class="main-content">
        <div class="emblem-container">
            <img id="mainLogo" src="" alt="Logo" class="main-logo" style="display: none;">
        </div>

        <header class="header-section">
            <h1 id="dynMainTitle" class="luxury-title">SENTDARA</h1>
            <div class="dark-divider">
                <span>●</span>
                <span id="dynSubTitle">loading...</span>
                <span>●</span>
            </div>
        </header>
        
        <div class="btn-container">
            <!-- ปุ่ม MEMBERS หลัก -->
            <a href="member.html" class="btn-members">
                <span>SENTDARA</span>
                <span>›</span>
            </a>
            <!-- เพิ่มกลุ่มปุ่มย่อย 2 ปุ่มแนวนอน -->
            <div class="sub-btn-group">
                <a href="member2.html" class="btn-sub">
                    <span>InflexStyle</span>
                </a>
                <a href="member3.html" class="btn-sub">
                    <span>Unforgettable</span>
                </a>
            </div>
        </div>

        <div class="partner-section-wrapper" id="partnerSectionWrapper" style="display: none;">
            <div class="partner-heading">PARTNER</div>
            <div class="partner-buttons-group" id="partnerButtonsGroup"></div>
        </div>
    </main>

    <div id="musicWidget" class="music-widget collapsed">
        <div class="music-header" id="toggleMusicBtn">
            <div class="cover-wrapper">
                <img id="musicCover" class="music-cover" src="https://placehold.co/100x100/111/444?text=🎵" alt="Cover">
            </div>
            <div class="music-info-mini">
                <span class="music-label">AUDIO STREAM</span>
                <div id="musicTitle" class="music-title">Unknown Track</div>
                <a id="musicLink" class="music-link" href="#" target="_blank">SOURCE LINK</a>
            </div>
            <div id="toggleIcon" class="toggle-icon">▲</div>
        </div>
        <div class="music-controls">
            <button id="playPauseBtn" class="ctrl-btn">▶</button>
            <div class="vol-wrapper">
                <span class="vol-icon" style="font-size:0.4rem; color:#aaa;">VOL</span>
                <input type="range" id="volumeSlider" class="vol-slider" min="0" max="1" step="0.01" value="0.2">
            </div>
        </div>
        <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    </div>

    <footer class="footer-credit">
        <span>SYSTEM DESIGN BY QA QEN</span>
        <span style="opacity: 0.3;">|</span>
        <a href="https://qaqenqcstudio.vercel.app" target="_blank" class="footer-link-web">คลิกเพื่อติดต่อทำเว็ป</a>
    </footer>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resizeCanvas); 
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.5; 
                this.speedX = (Math.random() * 4) + 1.5; 
                this.speedY = (Math.random() - 0.5) * 1.5; 
                this.opacity = Math.random() * 0.4 + 0.05;
                this.windFactor = Math.random() * 0.03;
            }
            update() {
                this.x += this.speedX; 
                this.y += this.speedY + Math.sin(this.x * this.windFactor) * 0.8;
                
                if (this.x > canvas.width + 10) {
                    this.x = -10;
                    this.y = Math.random() * canvas.height;
                }
                if (this.y < -10) this.y = canvas.height + 10; 
                if (this.y > canvas.height + 10) this.y = -10;
            }
            draw() {
                ctx.fillStyle = `rgba(180, 180, 190, ${this.opacity})`; 
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }
        
        const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 8000); 
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLViAczpHT0J9ujhc5OSNkOqEwABU4Emk",
            authDomain: "sentdara-46895.firebaseapp.com",
            projectId: "sentdara-46895",
            storageBucket: "sentdara-46895.firebasestorage.app",
            messagingSenderId: "919420693328",
            appId: "1:919420693328:web:783b6f1bcdc936b7f9da55"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let isPlaying = false; 
        audio.volume = 0.2;
        volumeSlider.value = 0.2;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const userStopped = sessionStorage.getItem('userStoppedMusic');
        if (savedTime) audio.currentTime = parseFloat(savedTime);

        if (userStopped !== 'true' && sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (sessionStorage.getItem('userStoppedMusic') === 'true') return;
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    isPlaying = true; 
                    sessionStorage.setItem('musicIsPlaying', 'true'); 
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); 
                playPauseBtn.innerHTML = '▶'; 
                musicWidget.classList.remove('playing'); 
                sessionStorage.setItem('musicIsPlaying', 'false');
                sessionStorage.setItem('userStoppedMusic', 'true');
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const cfg = docSnap.data();
                if (cfg.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${cfg.bgUrl}')`;
                if (cfg.faviconUrl) document.getElementById('siteFavicon').href = cfg.faviconUrl;
                if (cfg.mainTitle) document.getElementById('dynMainTitle').innerText = cfg.mainTitle;
                if (cfg.subTitle) document.getElementById('dynSubTitle').innerText = cfg.subTitle;
                if (cfg.logoUrl) {
                    const logo = document.getElementById('mainLogo');
                    logo.src = cfg.logoUrl; logo.style.display = 'block';
                    if (cfg.logoWidth) logo.style.width = cfg.logoWidth;
                }
                if (cfg.musicTitle) document.getElementById('musicTitle').innerText = cfg.musicTitle;
                if (cfg.musicLinkText) document.getElementById('musicLink').innerText = cfg.musicLinkText;
                if (cfg.musicLinkUrl) document.getElementById('musicLink').href = cfg.musicLinkUrl;
                if (cfg.musicCoverUrl) document.getElementById('musicCover').src = cfg.musicCoverUrl;
            }
        });

        onSnapshot(collection(db, "partners"), (snapshot) => {
            const partnerGroup = document.getElementById('partnerButtonsGroup');
            const partnerWrapper = document.getElementById('partnerSectionWrapper');
            partnerGroup.innerHTML = '';
            
            if (snapshot.empty) {
                partnerWrapper.style.display = 'none';
                return;
            }

            partnerWrapper.style.display = 'flex';
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const a = document.createElement('a');
                a.href = p.url || '#';
                a.target = '_blank';
                a.className = 'partner-btn';
                a.innerText = p.name;
                partnerGroup.appendChild(a);
            });
        });
    </script>
</body>
</html>
